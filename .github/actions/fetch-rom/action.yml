name: Fetch and decrypt the ROM
description: >
  Installs age and runs scripts/fetch_rom.sh to place the decrypted ROM at
  $RUNNER_TEMP/knife_edge.rom — outside the workspace and every
  actions/cache and artifact path, wiped when the job ends. Composite
  actions cannot read the `secrets` context; callers pass the four secret
  values via `with:` (log masking still applies — it is by value, not by
  context path). Must run after actions/checkout (local action, and it
  needs scripts/ present).
inputs:
  rom-url:
    description: KE_ROM_URL secret value
    required: true
  rom-age-key:
    description: KE_ROM_AGE_KEY secret value
    required: true
  b2-key-id:
    description: KE_B2_KEY_ID secret value (optional, together with b2-app-key)
    required: false
    default: ""
  b2-app-key:
    description: KE_B2_APP_KEY secret value (optional, together with b2-key-id)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Composite-action run steps need an explicit shell:, unlike workflow
    # steps. age is not preinstalled on the runner image.
    - name: Install age
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq age
    - name: Fetch + decrypt the ROM
      shell: bash
      env:
        KE_ROM_URL: ${{ inputs.rom-url }}
        KE_ROM_AGE_KEY: ${{ inputs.rom-age-key }}
        KE_B2_KEY_ID: ${{ inputs.b2-key-id }}
        KE_B2_APP_KEY: ${{ inputs.b2-app-key }}
      run: ./scripts/fetch_rom.sh "$RUNNER_TEMP/knife_edge.rom"
