name: build

# Repo policy (see README.md "Repository policy" and analysis/docs/build-notes.md):
# recompiler output is NOT committed (it is a build artifact); the repo holds
# only the analysis pipeline and metadata (config/*.toml, analysis/*.py) —
# only the ROM and asset/data dumps are excluded (.gitignore). That means the
# `build` job below compiles committed sources only: no ROM fetch, no
# secrets, no decryption step, so it works for pull requests from forks
# (which cannot receive secrets) exactly as before.
#
# The jobs below that DO need a ROM (linux-build, flatpak-build, regen-verify
# — plus publish, which needs no ROM at all, only the artifacts the first two
# produce) get one without any self-hosted runner: the project owner
# encrypts the ROM once with `age` (asymmetric — CI only ever holds the
# private half) and uploads the ciphertext to owner-controlled storage
# (Backblaze B2 in practice, but scripts/fetch_rom.sh accepts any
# curl-fetchable URL). Each ROM-needing job fetches that ciphertext and
# decrypts it in-run via the `.github/actions/fetch-rom` composite action
# (which wraps `scripts/fetch_rom.sh`) — only ciphertext ever sits in the
# bucket; the decrypted plaintext exists only in `$RUNNER_TEMP` (outside
# every actions/cache and artifact path, wiped when the job ends) and is
# mounted read-only into the build container. Fork PRs have no secrets, so
# those jobs skip cleanly via the `rom-gate` job below rather than failing.
# Same-repo PRs DO receive repository secrets normally, so they now produce
# the full artifact set too — this used to be manual-dispatch/tag-only, see
# "Status" in each job below for what changed. Full design, threat model,
# and the owner's one-time setup commands are in
# analysis/docs/build-notes.md, "Encrypted ROM in CI (Backblaze B2)".
#
# `pull_request_target` is never used anywhere in this workflow, deliberately:
# it would hand repository secrets to a workflow run checked out from
# untrusted fork code, which is exactly the hole this whole ROM-secrecy
# design exists to avoid. Plain `pull_request` only runs with the *base*
# repo's workflow file and secrets scoped normally (empty for forks) — that
# is the only PR trigger this file uses.
#
# All jobs below build through containers/Containerfile via
# scripts/container_build.sh — the same script a developer runs locally (see
# README.md "Building", Option C, and analysis/docs/build-notes.md
# "Containerized build"). There is deliberately no separate inline
# apt-get/cmake recipe here: the Containerfile is the one place the
# toolchain is defined, so CI and local dev can never drift apart. GitHub's
# hosted ubuntu-latest runners ship docker preinstalled, which is all these
# jobs need on the host side — no self-hosted runner exists anywhere in this
# workflow.
#
# `publish` is the sole job in this workflow with write permissions
# (`contents: write`, granted at job level only). Every other job — including
# linux-build and flatpak-build, which used to hold that grant when they were
# the ones creating/uploading to the release directly — runs with the
# workflow-level `contents: read` below. linux-build/flatpak-build now only
# upload build artifacts (actions/upload-artifact); publish downloads those
# same artifacts by name and is the only thing that ever touches the GitHub
# Releases API.
#
# The full Xvfb/lavapipe smoke test (scripts/smoke_test.sh) now runs inside
# the container on every full build (linux-build's `--smoke`), not just
# locally — see that job for details.

on:
  push:
    branches: [main, feature/windows-build]   # feature branches get CI via pull_request instead —
    # TEMPORARY while iterating windows-stub-build — remove before merge
    tags: ['v*']       # unfiltered push + pull_request would run everything twice
  pull_request:
  workflow_dispatch:
    # No inputs: dispatching means "also run the ROM-needing jobs on this
    # ref, if the ROM secrets are configured" (see rom-gate).

# One run per ref (PR merge refs are unique per PR). Superseded PR runs are
# cancelled; push/tag/dispatch runs never are — for push groups a newer
# QUEUED run replaces an older still-pending one, which is fine.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read   # `publish` alone widens this, at job level

jobs:
  # ---------------------------------------------------------------------------
  # Compile the project from committed sources (no ROM involved) and prove the
  # resulting binary is a well-formed executable via a no-ROM smoke test.
  # ---------------------------------------------------------------------------
  build:
    name: build (stub, no ROM)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache keys are pinned to the vendored submodules' actual checked-out
      # commits (not a content hash of their trees, which would be expensive
      # to compute over rt64's ~400MB checkout) so a submodule bump correctly
      # busts the cache.
      - name: Resolve submodule commits for cache keys
        id: submodules
        run: |
          echo "n64recomp=$(git -C deps/N64Recomp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(git -C deps/N64ModernRuntime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "rt64=$(git -C deps/rt64 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Host tools: N64Recomp / RSPRecomp (built from deps/N64Recomp), inside
      # the container, into deps/N64Recomp/build-container (see
      # scripts/container_build.sh — this directory is deliberately distinct
      # from deps/N64Recomp/build/, which is what a native/devcontainer host
      # build uses; the two must never share object dirs since they're built
      # with different toolchains). Cache key includes the Containerfile's
      # hash (in place of the old literal "clang19" tag) so any toolchain
      # change in the image busts this cache too, not just a submodule bump.
      # ---------------------------------------------------------------------
      - name: Cache N64Recomp host tools
        id: cache-host-tools
        uses: actions/cache@v4
        with:
          path: deps/N64Recomp/build-container
          key: n64recomp-host-${{ runner.os }}-${{ hashFiles('containers/Containerfile') }}-${{ steps.submodules.outputs.n64recomp }}

      # ---------------------------------------------------------------------
      # Main project: KnifeEdgeRecompiled, built WITHOUT a ROM. With no
      # KE_ROM, CMake compiles src/stub_game/ instead of recompiled game
      # code, so this job validates everything that is not ROM-derived
      # (runtime shim, RT64, librecomp, ultramodern, audio, input) with no
      # secrets and works for pull requests from forks.
      # ---------------------------------------------------------------------
      - name: Compute main build cache key
        id: buildkey
        run: |
          src_hash="${{ hashFiles('CMakeLists.txt', 'src/**', 'config/**') }}"
          key="build-${{ runner.os }}-${{ hashFiles('containers/Containerfile') }}-${{ steps.submodules.outputs.n64recomp }}-${{ steps.submodules.outputs.runtime }}-${{ steps.submodules.outputs.rt64 }}-$src_hash"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache main build directory
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build-container
          key: ${{ steps.buildkey.outputs.key }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('containers/Containerfile') }}-

      # ---------------------------------------------------------------------
      # Build + no-ROM smoke test, in one step: scripts/container_build.sh
      # --check builds host tools + KnifeEdgeRecompiled (both cached above,
      # since they land at the exact paths cached), then launches the binary
      # with DISPLAY/SDL_VIDEODRIVER unset under `timeout 15` and asserts
      # exit status exactly 1 (not 124 = hang, not >=128 = crash).
      #
      # Verified locally (see analysis/docs/build-notes.md and the session
      # that authored this check): src/main/main.cpp resolves the ROM
      # question *before* SDL/RT64 ever initialize a window
      # (recomp::is_rom_valid(...) is checked ahead of recomp::start()), so
      # on a plain headless runner with no DISPLAY set, SDL_ShowSimpleMessageBox
      # fails immediately (no video target), exit_error() falls through to its
      # stderr fprintf, and the process exits via
      # ultramodern::error_handling::quick_exit(EXIT_FAILURE) — no Xvfb
      # needed for this particular check (the container image has Xvfb for
      # scripts/smoke_test.sh's benefit, but this check deliberately runs
      # without it: testing showed that running this same no-ROM path under a
      # live Xvfb + DISPLAY makes SDL_ShowSimpleMessageBox draw a real modal
      # message box and block indefinitely waiting for a click that will
      # never come — exactly the hang this check must avoid).
      - name: Containerized build + no-ROM smoke test
        env:
          KE_CONTAINER_RUNTIME: docker # preinstalled on GitHub-hosted runners; explicit for clarity
        run: ./scripts/container_build.sh --check

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnifeEdgeRecompiled-linux-stub
          path: build-container/KnifeEdgeRecompiled
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows build (stub, no ROM): the Windows twin of `build` above, and built
  # for the same reason — no ROM, no secrets, works for pull requests from
  # forks exactly like the Linux stub job. It exists so the project's
  # `_WIN32` code paths (src/main/*.cpp) and CMakeLists.txt's WIN32 branch
  # (the DLL-staging POST_BUILD rule that copies SDL2.dll/dxcompiler.dll/
  # dxil.dll next to the exe) are continuously compiled and continuously
  # verified, not just occasionally hand-built on someone's Windows machine.
  # This is the first Windows leg of the project: native MSVC-ABI (clang-cl),
  # no container (containers/Containerfile is Linux-only), no ROM-gated
  # counterpart yet — that would be a future `windows-build` job reusing the
  # MSVC-environment step below next to live secrets, mirroring how
  # linux-build relates to build.
  #
  # IMPORTANT, do not "simplify": the CXX flags below
  # (-Xclang -fexceptions -Xclang -fcxx-exceptions) must NEVER be replaced
  # with /EHsc. The orderly-shutdown patch
  # (patches/n64modernruntime-orderly-shutdown.patch) throws
  # ultramodern::thread_terminated through recompiled `extern "C"` frames
  # (see CLAUDE.md, "Shutdown segfault on quit"); /EHsc's trailing `c` tells
  # the compiler extern-C functions never throw, and MSVC-ABI exception
  # unwinding is permitted to skip destructors/catch frames across such a
  # boundary on that promise. -fexceptions/-fcxx-exceptions (the Clang/Itanium
  # style flags, which clang-cl also understands via -Xclang) make no such
  # promise and are what keeps that throw path working on Windows.
  # ---------------------------------------------------------------------------
  windows-stub-build:
    name: "windows build (stub, no ROM)"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # MUST precede checkout. Git for Windows defaults to core.autocrlf=true,
      # which would give deps/N64ModernRuntime CRLF line endings and make
      # ke_apply_dep_patch's LF-only patch fail at cmake configure time.
      # longpaths guards deep object paths under the runner workspace.
      - name: Configure git for Windows checkouts
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve submodule commits for cache keys
        id: submodules
        shell: bash
        run: |
          echo "n64recomp=$(git -C deps/N64Recomp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(git -C deps/N64ModernRuntime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "rt64=$(git -C deps/rt64 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # Inline vswhere + vcvars64 instead of a third-party action: this
      # workflow's design keeps the trusted-code surface minimal (see the
      # header comment's pull_request_target discussion), and the ROM-gated
      # windows-build job will reuse this exact step next to live secrets.
      # Exports exactly INCLUDE/LIB/LIBPATH/PATH — not a blind `set` dump.
      - name: Set up the MSVC toolchain environment (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>>"%GITHUB_ENV%"
          echo PATH=%PATH%>>"%GITHUB_ENV%"

      # The cached build dir embeds absolute paths into the VS/LLVM installs
      # (CMakeCache.txt), so a runner-image bump must miss the cache. The
      # toolchain fingerprint is in BOTH the key and the restore-key prefix so
      # a partial restore can never cross a toolchain generation.
      - name: Toolchain fingerprint
        id: toolchain
        shell: bash
        run: |
          fp="$( { clang-cl --version; cmake --version; ninja --version; } | sha256sum | cut -c1-16 )"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          clang-cl --version

      # Safe to cache: no ROM exists anywhere in this job (stub build).
      # The ROM-gated windows-build job must NEVER copy this step for its
      # own build dir — see the cache-hygiene comments on linux-build.
      - name: Cache the Windows stub build directory
        uses: actions/cache@v4
        with:
          path: build-win
          key: build-win-stub-${{ steps.toolchain.outputs.fp }}-${{ steps.submodules.outputs.n64recomp }}-${{ steps.submodules.outputs.runtime }}-${{ steps.submodules.outputs.rt64 }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'patches/**') }}
          restore-keys: |
            build-win-stub-${{ steps.toolchain.outputs.fp }}-

      # -Xclang -fexceptions -Xclang -fcxx-exceptions: see job header comment;
      # NOT replaceable with /EHsc.
      #
      # On failure the real error lines are re-emitted as ::error::
      # annotations: annotations are visible in the PR UI and via the
      # unauthenticated REST API, while raw step logs are not — this keeps
      # Windows failures diagnosable without downloading logs.
      - name: Configure + build (clang-cl + Ninja, no ROM)
        shell: bash
        run: |
          set -euo pipefail
          annotate_and_die() {
            grep -aiE "error|FAILED:|fatal" "$1" | grep -av "::error" | tail -12 | \
              while IFS= read -r l; do printf '::error::%s\n' "${l:0:800}"; done
            exit 1
          }
          if ! cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_CXX_FLAGS='-Xclang -fexceptions -Xclang -fcxx-exceptions' \
            2>&1 | tee configure-win.log; then
            annotate_and_die configure-win.log
          fi
          if ! cmake --build build-win 2>&1 | tee build-win.log; then
            annotate_and_die build-win.log
          fi

      # A silently dropped -march=nehalem would lose SSE4.1 for librecomp's
      # RSP vector backend — turn "argument unused" warnings into failures.
      - name: Assert no compiler flags were silently dropped
        shell: bash
        run: |
          if grep -Eq "unknown argument|argument unused during compilation" build-win.log; then
            grep -E "unknown argument|argument unused during compilation" build-win.log | sort -u | head -20
            echo "::error::clang-cl rejected or ignored a compile flag. If -march=nehalem was dropped, use the /clang: passthrough fallback (see CMakeLists.txt toolchain guard comment)."
            exit 1
          fi

      # Kill-based, never exit-code-based: with no ROM, the exe now reaches
      # the NFD file dialog on Windows (have_display is true there by design)
      # and exit_error() shows a modal MessageBox — either can block forever
      # on a runner. This asserts exactly one thing: the process image loads
      # and main() runs, i.e. SDL2.dll/dxcompiler.dll/dxil.dll resolved and
      # the CRT is satisfied. The Linux `build` job's exit-code contract does
      # NOT transfer to Windows.
      #
      # The stable substring matched below ("Knife Edge Recompiled") is
      # kerecomp::log_build_info()'s literal prefix (src/main/support.cpp:
      # `"Knife Edge Recompiled - build %s%s\n"`, stdout, immediately
      # fflush'd) — verified against the source, not guessed.
      - name: Launch check (startup line only, kill-based)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build-win\KnifeEdgeRecompiled.exe `
               -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          if (-not $p.WaitForExit(30000)) {
            Write-Host "process still alive after 30s (expected: file dialog / no GPU); killing"
            $p.Kill()
            $p.WaitForExit()
          }
          Write-Host "--- stdout ---"; Get-Content out.txt -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content err.txt -ErrorAction SilentlyContinue
          if (-not (Select-String -Path out.txt -SimpleMatch 'Knife Edge Recompiled')) {
            Write-Host "::error::the exe did not print its startup build line — it failed before main() (missing DLL beside the exe is the usual cause)"
            exit 1
          }

      # The stub exe + the three staged DLLs: uploading the DLLs makes the
      # POST_BUILD staging rule continuously verified by a fork-runnable job.
      # Name deliberately NOT matched by publish's by-name downloads.
      - name: Upload stub artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnifeEdgeRecompiled-windows-stub
          path: |
            build-win/KnifeEdgeRecompiled.exe
            build-win/SDL2.dll
            build-win/dxcompiler.dll
            build-win/dxil.dll
          if-no-files-found: error
          retention-days: 7

  # The `secrets` context is not available in job-level `if:` expressions, so
  # this tiny job turns "are the ROM secrets configured?" into a job output
  # the ROM-needing jobs below can gate on via `needs`. Same-repo `pull_request`
  # runs receive repository secrets normally, exactly like a push — only runs
  # from a forked repository (and Dependabot-authored PRs, which read a
  # separate secrets store) get an empty `secrets` context, so `have` comes
  # back 'false' and those jobs skip cleanly, preserving the invariant that
  # normal CI needs no ROM and no secrets. `pull_request_target` is never used
  # in this workflow, deliberately: untrusted PR code must never run with
  # secrets in scope. This job itself has no checkout step and executes no
  # repository code at all — keep it that way; it exists purely to read
  # `secrets` and republish a boolean.
  rom-gate:
    name: "rom-gate (are ROM secrets configured?)"
    # Belt-and-suspenders: the `on:` filters above already guarantee this job
    # never fires on a feature-branch push, but a future widening of
    # `on.push` (e.g. dropping the `branches:` filter) must not silently
    # start fetching the ROM on every branch — this `if:` is an independent
    # backstop against that.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      have: ${{ steps.check.outputs.have }}
    steps:
      - name: Check for ROM secrets
        id: check
        env:
          HAVE: ${{ (secrets.KE_ROM_URL != '' && secrets.KE_ROM_AGE_KEY != '') && 'true' || 'false' }}
        run: |
          echo "have=$HAVE" >> "$GITHUB_OUTPUT"
          if [ "$HAVE" != "true" ]; then
            echo "::notice::KE_ROM_URL / KE_ROM_AGE_KEY secrets not configured — ROM-needing jobs will be skipped. See analysis/docs/build-notes.md, 'Encrypted ROM in CI'."
          fi

  # ---------------------------------------------------------------------------
  # linux build: produces the shippable tarball, which contains recompiled
  # game *code* but no assets or game data (verified: no ROM asset bytes are
  # embedded — the game reads everything from the player's own ROM at
  # runtime). Players must supply their own ROM; the binary refuses to run
  # without a matching one.
  #
  # Status: runs on every same-repo PR, every push to main, every version
  # tag, and manual dispatch — anywhere rom-gate found the ROM secrets
  # configured (fork PRs and secretless forks never have them, so this job
  # skips cleanly there rather than failing). This used to be
  # manual-dispatch-only (job name `release`); it's now continuous so a PR
  # proves the full build works, and produces a downloadable artifact,
  # before merge — not just after a hand-triggered dispatch.
  # ---------------------------------------------------------------------------
  linux-build:
    name: "linux build (full ROM, tarball artifact)"
    needs: rom-gate
    if: needs.rom-gate.outputs.have == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve submodule commits for cache keys
        id: submodules
        run: |
          echo "n64recomp=$(git -C deps/N64Recomp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only the N64Recomp/RSPRecomp host-tool build is cached here, not
      # build-container/ itself: that directory's *content* differs
      # depending on whether -DKE_ROM was passed (this job always passes it;
      # the build job above never does), while sharing the exact same cache
      # key formula as the build job would. Caching it under a
      # ROM-independent key would risk a `build` job run and a `linux-build`
      # job run silently colliding on the same cache slot despite configuring
      # CMake differently. The host-tool build has no such issue — it does
      # not depend on KE_ROM at all — so it's safe to share verbatim.
      #
      # There's a second, more serious reason build-container/ specifically
      # must never be cached from this job: it contains knife_edge.z64, the
      # decrypted, normalized ROM. actions/cache entries saved from a run on
      # the default branch are restorable by workflow runs triggered from a
      # fork PR (GitHub's cache-scoping rules permit reads across that
      # boundary for the base branch's caches). Caching build-container/ here
      # would hand the ROM to arbitrary fork-authored code the next time a
      # fork PR happened to request this key. Excluding just the z64 file
      # from the cached path would be too fragile to bet this policy on (one
      # missed path pattern and the ROM is back in the cache) — the only
      # robust rule is: this directory is never cached from a ROM-driven job,
      # full stop.
      - name: Cache N64Recomp host tools
        uses: actions/cache@v4
        with:
          path: deps/N64Recomp/build-container
          key: n64recomp-host-${{ runner.os }}-${{ hashFiles('containers/Containerfile') }}-${{ steps.submodules.outputs.n64recomp }}

      - name: Fetch + decrypt the ROM (to $RUNNER_TEMP)
        uses: ./.github/actions/fetch-rom
        with:
          rom-url: ${{ secrets.KE_ROM_URL }}
          rom-age-key: ${{ secrets.KE_ROM_AGE_KEY }}
          b2-key-id: ${{ secrets.KE_B2_KEY_ID }}
          b2-app-key: ${{ secrets.KE_B2_APP_KEY }}

      # KE_ROM makes CMake normalize the ROM, run the analysis pipeline, and
      # invoke N64Recomp + RSPRecomp at configure time (see CMakeLists.txt) —
      # scripts/container_build.sh --rom does all of this inside the
      # container, landing output in build-container/.
      #
      # --smoke runs scripts/smoke_test.sh INSIDE the container (the image
      # ships Xvfb, lavapipe, imagemagick, bc, procps — see
      # containers/Containerfile), asserting the game actually boots with
      # real video and non-silent audio on every full build — unlike the
      # stub job's `--check` above, which deliberately runs with no display
      # at all (a no-ROM build has nothing playable to smoke-test).
      - name: Containerized build + full smoke test (regenerates game code from the ROM)
        env:
          KE_CONTAINER_RUNTIME: docker
        run: ./scripts/container_build.sh --rom "$RUNNER_TEMP/knife_edge.rom" --smoke

      # Fails the build if any ROM asset bytes leaked into the binary. Runs
      # directly on the runner (not in the container), stdlib only; shared
      # with flatpak-build below (scripts/assert_no_rom_assets.py).
      - name: Assert the binary embeds no game assets
        run: python3 scripts/assert_no_rom_assets.py build-container/knife_edge.z64 build-container/KnifeEdgeRecompiled

      - name: Assemble release tarball
        id: tarball
        run: |
          # Tags name the artifact; PR/dispatch/main runs get the short SHA.
          # ($GITHUB_REF_NAME is unusable on PRs: "123/merge" contains '/'.)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git rev-parse --short=8 HEAD)"
          fi
          dir="KnifeEdgeRecompiled-linux-x86_64-${version}"
          tarball="${dir}.tar.gz"
          # Stage in $RUNNER_TEMP/stage — a clean dir; the decrypted ROM sits
          # at $RUNNER_TEMP/knife_edge.rom, OUTSIDE stage/, so it cannot be
          # swept into the archive.
          mkdir -p "$RUNNER_TEMP/stage/$dir"
          cp build-container/KnifeEdgeRecompiled COPYING packaging/linux/README.txt \
             "$RUNNER_TEMP/stage/$dir/"
          # Deterministic-ish archive: fixed ownership + name-sorted entries
          # (mtimes still vary with the build; good enough for CI).
          tar --owner=0 --group=0 --numeric-owner --sort=name \
              -czf "$tarball" -C "$RUNNER_TEMP/stage" "$dir"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnifeEdgeRecompiled-linux-x86_64   # fixed name; the version lives in the filename
          path: ${{ steps.tarball.outputs.tarball }}
          if-no-files-found: error
          compression-level: 0    # contents are already gzip
          retention-days: 14      # PR/inspection artifacts; publish consumes in-run

  # ---------------------------------------------------------------------------
  # windows build: the Windows twin of linux-build above — full-ROM build on
  # windows-latest, producing the shippable release zip. ROM-gated identically
  # (needs: rom-gate, same `if:`), so it runs on every same-repo PR, push to
  # main, version tag, and manual dispatch wherever rom-gate found the ROM
  # secrets configured, and skips cleanly on forks. Native toolchain, no
  # container: containers/Containerfile is Linux-only, so this job reuses the
  # inline MSVC-environment setup windows-stub-build proved out rather than
  # anything container-based.
  #
  # ROM hygiene is identical to linux-build's: the decrypted ROM only ever
  # exists under $RUNNER_TEMP, and the ROM-populated game build directory
  # (build-win/, which contains knife_edge.z64) is NEVER cached — full stop.
  # This is the same "default-branch caches are restorable by fork-PR runs"
  # rationale as linux-build's cache-hygiene comment above; see there for the
  # full argument. Contrast with windows-stub-build, whose build-win cache is
  # safe precisely because no ROM ever exists in that job at all.
  # ---------------------------------------------------------------------------
  windows-build:
    name: "windows build (full ROM, zip artifact)"
    needs: rom-gate
    if: needs.rom-gate.outputs.have == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # MUST precede checkout. Git for Windows defaults to core.autocrlf=true,
      # which would give deps/N64ModernRuntime CRLF line endings and make
      # ke_apply_dep_patch's LF-only patch fail at cmake configure time.
      # longpaths guards deep object paths under the runner workspace.
      - name: Configure git for Windows checkouts
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Only the N64Recomp cache key input is needed here (this job's own
      # host-tools cache below); build-win itself is never cached (see the
      # job header comment), so there is nothing to key off runtime/rt64.
      - name: Resolve submodule commits for cache keys
        id: submodules
        shell: bash
        run: |
          echo "n64recomp=$(git -C deps/N64Recomp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # Same step as windows-stub-build — see there.
      - name: Set up the MSVC toolchain environment (x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul
          echo INCLUDE=%INCLUDE%>>"%GITHUB_ENV%"
          echo LIB=%LIB%>>"%GITHUB_ENV%"
          echo LIBPATH=%LIBPATH%>>"%GITHUB_ENV%"
          echo PATH=%PATH%>>"%GITHUB_ENV%"

      # Same step as windows-stub-build — see there.
      - name: Toolchain fingerprint
        id: toolchain
        shell: bash
        run: |
          fp="$( { clang-cl --version; cmake --version; ninja --version; } | sha256sum | cut -c1-16 )"
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          clang-cl --version

      # Safe to cache: this caches ONLY the N64Recomp/RSPRecomp host-tool
      # build (deps/N64Recomp/build-win), which never depends on KE_ROM at
      # all. The game build directory, build-win/ at the repo root, is a
      # completely different path and is NEVER cached from this job, full
      # stop — it contains knife_edge.z64, the decrypted, normalized ROM, and
      # actions/cache entries saved from a run on the default branch are
      # restorable by workflow runs triggered from a fork PR (see
      # linux-build's cache-hygiene comment above for the full argument).
      - name: Cache N64Recomp host tools (Windows)
        id: cache-host-tools
        uses: actions/cache@v4
        with:
          path: deps/N64Recomp/build-win
          key: n64recomp-host-${{ runner.os }}-${{ steps.toolchain.outputs.fp }}-${{ steps.submodules.outputs.n64recomp }}

      # Default MSVC cl.exe — the exact configuration upstream N64Recomp's own
      # windows-latest CI builds. The host tools are standalone processes with
      # no ABI coupling to our clang-cl game exe below, so the toolchain mix
      # is deliberate — do not "harmonize" this to clang-cl.
      # --target N64RecompCLI RSPRecomp are the real target names; `ninja
      # N64Recomp` would fail (the output file is N64Recomp.exe, but the
      # target that produces it is named N64RecompCLI).
      - name: Build N64Recomp host tools
        if: steps.cache-host-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S deps/N64Recomp -B deps/N64Recomp/build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build deps/N64Recomp/build-win --target N64RecompCLI RSPRecomp

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # All three ship win_amd64 wheels (rabbitizer, capstone) or are pure
      # Python (tomlkit) — verified by the Phase-0 spike run for this job.
      - name: Install analysis pipeline dependencies
        run: python -m pip install --disable-pip-version-check rabbitizer capstone tomlkit

      - name: Fetch the ROM
        id: rom
        uses: ./.github/actions/fetch-rom
        with:
          rom-url: ${{ secrets.KE_ROM_URL }}
          rom-age-key: ${{ secrets.KE_ROM_AGE_KEY }}
          b2-key-id: ${{ secrets.KE_B2_KEY_ID }}
          b2-app-key: ${{ secrets.KE_B2_APP_KEY }}

      # -DKE_PYTHON pinned for the same reason scripts/container_build.sh
      # pins it on the Linux side: never let CMake's interpreter discovery
      # silently prefer some other Python found on PATH. -DN64RECOMP_HOST_TOOL
      # / -DRSPRECOMP_HOST_TOOL point at the host tools built (or
      # cache-restored) above instead of letting CMake build them again
      # in-tree. CXX flags: see windows-stub-build's /EHsc comment — same
      # reasoning, same prohibition on "simplifying" this to /EHsc.
      # On failure the real error lines are re-emitted as ::error::
      # annotations (see windows-stub-build's configure step). NOTE: this is
      # safe here only because grep pulls lines from CMake/compiler output,
      # which never contains secret values — fetch-rom runs in its own step
      # and fetch_rom.sh never prints secrets on any path (reviewed).
      - name: Configure + build (clang-cl + Ninja, full ROM)
        shell: bash
        run: |
          set -euo pipefail
          annotate_and_die() {
            grep -aiE "error|FAILED:|fatal" "$1" | grep -av "::error" | tail -12 | \
              while IFS= read -r l; do printf '::error::%s\n' "${l:0:800}"; done
            exit 1
          }
          if ! cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_CXX_FLAGS='-Xclang -fexceptions -Xclang -fcxx-exceptions' \
            -DKE_PYTHON='${{ steps.py.outputs.python-path }}' \
            -DN64RECOMP_HOST_TOOL="$PWD/deps/N64Recomp/build-win/N64Recomp.exe" \
            -DRSPRECOMP_HOST_TOOL="$PWD/deps/N64Recomp/build-win/RSPRecomp.exe" \
            -DKE_ROM='${{ steps.rom.outputs.rom-path }}' \
            2>&1 | tee configure-win.log; then
            annotate_and_die configure-win.log
          fi
          if ! cmake --build build-win 2>&1 | tee build-win.log; then
            annotate_and_die build-win.log
          fi

      # A silently dropped -march=nehalem would lose SSE4.1 for librecomp's
      # RSP vector backend — turn "argument unused" warnings into failures.
      # Same check as windows-stub-build.
      - name: Assert no compiler flags were silently dropped
        shell: bash
        run: |
          if grep -Eq "unknown argument|argument unused during compilation" build-win.log; then
            grep -E "unknown argument|argument unused during compilation" build-win.log | sort -u | head -20
            echo "::error::clang-cl rejected or ignored a compile flag. If -march=nehalem was dropped, use the /clang: passthrough fallback (see CMakeLists.txt toolchain guard comment)."
            exit 1
          fi

      # Fails the build if any ROM asset bytes leaked into the binary. Same
      # shared script as linux-build's assertion (scripts/assert_no_rom_assets.py)
      # and the same normalized-ROM path convention: CMake writes
      # knife_edge.z64 into the build dir (build-win/ here, build-container/
      # there) alongside the exe.
      - name: Assert the binary embeds no ROM assets
        shell: bash
        run: python scripts/assert_no_rom_assets.py build-win/knife_edge.z64 build-win/KnifeEdgeRecompiled.exe

      # Same kill-based launch check as windows-stub-build, byte-identical:
      # it asserts only that the startup line printed, nothing ROM-specific.
      # This full-ROM exe is run with no --rom argument and the decrypted ROM
      # sitting in $RUNNER_TEMP rather than the exe's own data dir, so it
      # cannot find a cached ROM either — same file-dialog-or-nothing path the
      # stub job exercises, same reason a kill-based (not exit-code-based)
      # check is required.
      - name: Launch check (startup line only, kill-based)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build-win\KnifeEdgeRecompiled.exe `
               -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru -NoNewWindow
          if (-not $p.WaitForExit(30000)) {
            Write-Host "process still alive after 30s (expected: file dialog / no GPU); killing"
            $p.Kill()
            $p.WaitForExit()
          }
          Write-Host "--- stdout ---"; Get-Content out.txt -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content err.txt -ErrorAction SilentlyContinue
          if (-not (Select-String -Path out.txt -SimpleMatch 'Knife Edge Recompiled')) {
            Write-Host "::error::the exe did not print its startup build line — it failed before main() (missing DLL beside the exe is the usual cause)"
            exit 1
          }

      - name: Assemble release zip
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          # Same version convention as linux-build: tag name for v* tags, else the
          # short SHA (PR ref names contain '/', unusable in a filename).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git rev-parse --short=8 HEAD)"
          fi
          dir="KnifeEdgeRecompiled-windows-x86_64-${version}"
          # Staged in $RUNNER_TEMP/stage: the working tree never grows a release
          # dir, and the decrypted ROM at $RUNNER_TEMP/knife_edge.rom sits OUTSIDE
          # the staged subtree — only $stage/$dir is zipped.
          stage="$(cygpath -u "$RUNNER_TEMP")/stage"
          mkdir -p "$stage/$dir"
          cp build-win/KnifeEdgeRecompiled.exe \
             build-win/SDL2.dll build-win/dxcompiler.dll build-win/dxil.dll \
             COPYING packaging/windows/README.txt \
             "$stage/$dir/"
          # 7z is preinstalled on windows-latest and on PATH under Git Bash.
          # 7z is a native (non-msys) tool, and this workflow can't be test-run
          # on a real windows-latest before landing, so rather than assert a
          # path form for $GITHUB_WORKSPACE (Git Bash env vars from the runner
          # process are not reliably msys-translated, and getting this wrong
          # would mean 7z silently writes somewhere unexpected instead of
          # failing loudly) this sidesteps the question entirely: write the
          # zip to a plain relative filename in the current directory (which
          # `cd "$stage"` has already made unambiguous to every tool in this
          # step, msys or native), then `mv` it into the workspace root with
          # bash, which — being an msys tool itself — already handles that
          # translation correctly.
          (cd "$stage" && 7z a -tzip -mx=9 "${dir}.zip" "$dir" >/dev/null)
          mv "$stage/${dir}.zip" "${dir}.zip"
          echo "zip=${dir}.zip" >> "$GITHUB_OUTPUT"
          ls -l "${dir}.zip"

      # Fixed artifact name; the version lives only in the inner filename (see
      # linux-build's tarball upload step — same convention).
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnifeEdgeRecompiled-windows-x86_64
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
          compression-level: 0    # contents are already a zip
          retention-days: 14      # PR/inspection artifacts; publish consumes in-run

  # ---------------------------------------------------------------------------
  # Prove the analysis pipeline is deterministic: regenerate the symbol/config
  # metadata from an actual ROM and assert config/ is unchanged versus what's
  # committed. Recompiler output itself is not committed, so there is nothing
  # else to diff.
  #
  # Status: runs on every same-repo PR now too (config/ drift is caught
  # before merge, not just after push to main), plus every push to main and
  # manual dispatch. Deliberately NOT run on tag pushes — tags are cut from
  # main, which already verified this, and `publish` below doesn't depend on
  # this job at all. It still skips wherever the ROM secrets aren't
  # configured (rom-gate), e.g. on a fork.
  # ---------------------------------------------------------------------------
  regen-verify:
    name: "regen-verify (PRs, pushes to main, manual dispatch)"
    needs: rom-gate
    if: >-
      needs.rom-gate.outputs.have == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch + decrypt the ROM (to $RUNNER_TEMP)
        uses: ./.github/actions/fetch-rom
        with:
          rom-url: ${{ secrets.KE_ROM_URL }}
          rom-age-key: ${{ secrets.KE_ROM_AGE_KEY }}
          b2-key-id: ${{ secrets.KE_B2_KEY_ID }}
          b2-app-key: ${{ secrets.KE_B2_APP_KEY }}

      # One --exec call, all inside the container: build n64sym (the
      # analysis pipeline's identification oracle), build the N64Recomp host
      # tool into deps/N64Recomp/build-container, ingest the mounted ROM
      # (mounted at /rom/rom.n64 by --rom) to build/knife_edge.z64 — that
      # exact path because analysis/Makefile hardcodes
      # $(ROOT)/build/knife_edge.z64, not build-container/ — regenerate
      # config/ via `make -C analysis`, run N64Recomp against the freshly
      # regenerated config, and diff config/ against what's committed.
      - name: Regenerate + verify (containerized)
        env:
          KE_CONTAINER_RUNTIME: docker
        run: |
          ./scripts/container_build.sh --rom "$RUNNER_TEMP/knife_edge.rom" --exec '
            set -euo pipefail
            echo "==> building n64sym (analysis pipeline identification oracle)"
            make -C deps/n64sym

            echo "==> building N64Recomp host tool (deps/N64Recomp/build-container)"
            cmake -S deps/N64Recomp -B deps/N64Recomp/build-container -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
            ninja -C deps/N64Recomp/build-container N64Recomp

            echo "==> ingesting the ROM (normalize to build/knife_edge.z64)"
            mkdir -p build
            python3 analysis/byteswap.py /rom/rom.n64 build/knife_edge.z64

            echo "==> regenerating symbols + config (make -C analysis)"
            make -C analysis PY=/opt/ke-pyenv/bin/python

            echo "==> running N64Recomp (output is a build artifact, not committed)"
            deps/N64Recomp/build-container/N64Recomp config/knife_edge.us.toml

            echo "==> asserting regenerated metadata matches what is committed in config/"
            if ! git diff --exit-code -- config; then
              echo "::error::regenerating from the ROM produced output that differs from what is committed in config/ — see the diff above. Either the analysis pipeline changed behavior or the committed output is stale; investigate before merging."
              exit 1
            fi
            echo "OK: regenerated output is byte-identical to what is committed."
          '

  # ---------------------------------------------------------------------------
  # Flatpak build: builds the .flatpak bundle. Hosted runner, no self-hosted
  # anything, like every other job in this workflow.
  #
  # Status: runs on every same-repo PR, push to main, version tag, and manual
  # dispatch — anywhere rom-gate found the ROM secrets configured. This used
  # to be tag-push-only (job name `flatpak-release`, and it created/uploaded
  # the GitHub release itself); it's now continuous, so a PR proves the
  # bundle builds and leaks nothing pre-merge, and it only produces an
  # artifact — publishing to a release for tag pushes moved to the `publish`
  # job below, which is now the only place in this workflow with write
  # permissions.
  #
  # What this job installs beyond the usual and why:
  #   - flatpak + flatpak-builder: not preinstalled on ubuntu-latest. (age is
  #     no longer installed here directly — the fetch-rom composite action
  #     handles it.)
  #   - a sysctl tweak: ubuntu-24.04 runner images restrict unprivileged user
  #     namespaces via AppArmor by default, which breaks bubblewrap (bwrap),
  #     which flatpak-builder requires to sandbox its build. Without this the
  #     build fails at the first sandboxed step.
  #   - the flathub remote + freedesktop runtime/Sdk/llvm20 extension
  #     (scripts/build_flatpak.sh --runtime-install), cached across runs
  #     (keyed on the manifest, so a runtime-version bump busts it) since a
  #     cold fetch is a ~1.5 GB flathub download.
  #
  # generated/us (where the flatpak manifest's `dir` source expects
  # recompiled code) is produced the same way as every other ROM-touching
  # job: fetch + decrypt the ROM, then run both recompilers against the
  # committed config/*.toml inside the canonical build container.
  #
  # Dir-source staging hazard: the manifest's `dir` source copies the WHOLE
  # working tree into flatpak-builder's sandbox with no exclusion mechanism
  # (see analysis/docs/build-notes.md, "Flatpak packaging"). By the time
  # sources are generated, build/knife_edge.z64 (the normalized ROM) sits in
  # the tree — it must not even be *staged* into the sandbox, so the
  # "Quarantine" step below moves it out to $RUNNER_TEMP and deletes
  # build/build-container before the Flatpak bundle step runs. The bundle
  # step's own output never receives ROM assets either way (no install()
  # rule copies them — see build-notes.md), but staging is already more
  # exposure than policy allows.
  #
  # The bundle contains recompiled code and zero game assets, same policy as
  # the linux-build tarball above; the final assertion step proves it the
  # same way (the shared scripts/assert_no_rom_assets.py), just against the
  # flatpak-builder build tree's binary path instead of build-container/'s.
  # ---------------------------------------------------------------------------
  flatpak-build:
    name: "flatpak build (full ROM, bundle artifact)"
    needs: rom-gate
    if: needs.rom-gate.outputs.have == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install flatpak and flatpak-builder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flatpak flatpak-builder

      # ubuntu-24.04 runner images restrict unprivileged user namespaces via
      # AppArmor, which breaks bubblewrap, which flatpak-builder requires.
      - name: Allow unprivileged user namespaces (bwrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "apparmor userns knob absent; continuing"

      # Keyed on the manifest so a runtime-version bump busts it; a cold
      # cache costs a ~1.5 GB flathub download.
      - name: Cache flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ runner.os }}-${{ hashFiles('packaging/flatpak/io.github.haydenmc.KnifeEdgeRecompiled.yml') }}

      # Fast no-op when the cache restored the refs.
      - name: Install the freedesktop runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          ./scripts/build_flatpak.sh --runtime-install

      - name: Fetch + decrypt the ROM (to $RUNNER_TEMP)
        uses: ./.github/actions/fetch-rom
        with:
          rom-url: ${{ secrets.KE_ROM_URL }}
          rom-age-key: ${{ secrets.KE_ROM_AGE_KEY }}
          b2-key-id: ${{ secrets.KE_B2_KEY_ID }}
          b2-app-key: ${{ secrets.KE_B2_APP_KEY }}

      # Produce generated/us at the repo root, where the flatpak manifest's
      # dir source expects it: ingest the ROM to build/knife_edge.z64 (the
      # committed config/*.toml rom_file_path), then run both recompilers
      # against the committed configs — their output paths land in
      # generated/us and generated/us/rsp. All inside the canonical build
      # container, same as every other ROM-touching job.
      - name: Generate recompiled sources (containerized)
        env:
          KE_CONTAINER_RUNTIME: docker
        run: |
          ./scripts/container_build.sh --rom "$RUNNER_TEMP/knife_edge.rom" --exec '
            set -euo pipefail
            echo "==> building N64Recomp + RSPRecomp host tools"
            cmake -S deps/N64Recomp -B deps/N64Recomp/build-container -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
            ninja -C deps/N64Recomp/build-container N64Recomp RSPRecomp
            echo "==> ingesting the ROM (normalize to build/knife_edge.z64)"
            mkdir -p build
            python3 analysis/byteswap.py /rom/rom.n64 build/knife_edge.z64
            echo "==> recompiling game code + audio microcode into generated/us"
            deps/N64Recomp/build-container/N64Recomp config/knife_edge.us.toml
            deps/N64Recomp/build-container/RSPRecomp config/aspMain.us.toml
          '

      # The flatpak manifest's `dir` source copies the whole working tree
      # into flatpak-builder's build sandbox with no exclusion mechanism, and
      # the step above left the normalized ROM at build/knife_edge.z64 — it
      # must not even be *staged* into the sandbox (it was never *installed*
      # into /app, but staging it is already more exposure than policy
      # allows). Keep a copy outside the tree for the leak assertion below,
      # then remove it from the tree entirely.
      - name: Quarantine ROM-derived files out of the source tree
        run: |
          mv build/knife_edge.z64 "$RUNNER_TEMP/knife_edge.z64"
          rm -rf build build-container

      # flatpak-builder runs on the runner host itself (not in the container):
      # it needs its own bwrap sandboxing, which nested containers break.
      - name: Build the Flatpak bundle
        run: ./scripts/build_flatpak.sh --bundle KnifeEdgeRecompiled.flatpak

      # Fails the build if any ROM asset bytes leaked into the bundled
      # binary. Same shared script as linux-build's assertion above
      # (scripts/assert_no_rom_assets.py), against the flatpak-builder build
      # tree's binary path instead of build-container/'s. The `test -f`
      # guard stays: flatpak-builder's internal build-directory layout is not
      # something this project controls, so a stale-layout assumption must
      # fail loudly with a clear message rather than the assertion silently
      # no-oping on a missing file.
      - name: Assert the flatpak binary embeds no game assets
        run: |
          if [ ! -f build-flatpak/build/files/bin/knife-edge-recompiled-bin ]; then
            echo "::error::expected binary not found at build-flatpak/build/files/bin/knife-edge-recompiled-bin — flatpak-builder's build tree layout assumption is stale, update this step"
            exit 1
          fi
          python3 scripts/assert_no_rom_assets.py "$RUNNER_TEMP/knife_edge.z64" build-flatpak/build/files/bin/knife-edge-recompiled-bin

      - name: Upload flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnifeEdgeRecompiled-flatpak
          path: KnifeEdgeRecompiled.flatpak
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish: the ONLY job in this workflow with write permissions. Thin by
  # design — it builds nothing and runs no checked-out code (no checkout
  # step); it downloads the three artifacts the build jobs above produced in
  # THIS run and attaches them to the GitHub release for the tag (creating
  # the release if the tag was pushed bare). A skipped dependency (ROM
  # secrets missing) auto-skips this job via the implicit success() on
  # `needs` — do not add always()/!cancelled() here, ever.
  #
  # windows-build is release-blocking here by owner decision: it sits in
  # `needs` on equal footing with linux-build and flatpak-build, not
  # best-effort. A Windows-only failure on a tag push attaches nothing —
  # releases are atomic, all three platforms or none — and recovery is
  # fix-and-retag, same as a failure in either of the other two.
  #
  # The three download steps are BY NAME, not a KnifeEdgeRecompiled-* pattern:
  # a pattern would also match the stub jobs' KnifeEdgeRecompiled-linux-stub /
  # KnifeEdgeRecompiled-windows-stub artifacts, and the stub binaries must
  # never be attached to a release.
  # ---------------------------------------------------------------------------
  publish:
    name: "publish (version tags)"
    needs: [linux-build, flatpak-build, windows-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release + upload assets; replaces the workflow-level read-only grant for this job only
    steps:
      - name: Download the linux tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: KnifeEdgeRecompiled-linux-x86_64
          path: dist

      - name: Download the flatpak artifact
        uses: actions/download-artifact@v4
        with:
          name: KnifeEdgeRecompiled-flatpak
          path: dist

      - name: Download the windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: KnifeEdgeRecompiled-windows-x86_64
          path: dist

      - name: Create the release if needed, then upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" dist/* --clobber
