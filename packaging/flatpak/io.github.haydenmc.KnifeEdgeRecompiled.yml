app-id: io.github.haydenmc.KnifeEdgeRecompiled
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20

# Superproject subprojects (zstd et al) install headers/tools/man pages into
# /app as a side effect of `ninja install`; none of it is needed at runtime.
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - /bin/zstd*
  - /bin/unzstd
# Not the raw binary: the wrapper sets KE_DATA_DIR to a per-app XDG path (see
# knife-edge-recompiled.sh) before exec'ing the real executable.
command: knife-edge-recompiled.sh

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc
  # Deliberately NO --filesystem=* of any kind. The game has no use for host
  # files except the one time it needs a ROM, and that's handled by the
  # portal ROM picker (src/main/main.cpp, NFD_OpenDialogU8 via the
  # xdg-desktop-portal FileChooser) -- portal file access needs no
  # filesystem permission at all, that's the whole point of portals: the
  # user grants access to one file, per-use, from outside the sandbox, and
  # the picked path is handed back through the portal rather than requiring
  # the sandbox to already be able to see it. ROM cache/config similarly
  # live under the app's own private data dir (KE_DATA_DIR below), which
  # every Flatpak app can already write to without any finish-arg.

modules:
  # Module name is load-bearing: config-opts below hardcodes
  # /run/build/knife-edge-recompiled/generated/us as KE_GENERATED_DIR,
  # which is flatpak-builder's in-sandbox source path for a `dir` source
  # -- /run/build/<this module's name>/<path inside the copied source tree>.
  # Renaming this module requires updating that path too.
  - name: knife-edge-recompiled
    buildsystem: cmake-ninja
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        CC: clang
        CXX: clang++
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
      # No ROM, no python, no N64Recomp/RSPRecomp host tools in this
      # sandbox (see build-notes.md, "Flatpak packaging") -- the recompiled
      # C is supplied as pre-generated source instead (KE_GENERATED_DIR),
      # which is why the source below is `type: dir` over the whole repo
      # rather than a `type: git` checkout: it needs generated/ (gitignored,
      # a build artifact everywhere else) to already be present.
      - -DKE_GENERATED_DIR=/run/build/knife-edge-recompiled/generated/us
    sources:
      - type: dir
        path: ../..
        # dir sources have no documented skip/exclude mechanism in the
        # flatpak-builder version this was written against, so this copies
        # the whole working tree -- including deps/ (~1 GB with rt64's
        # vendored contrib libs) and .git. That's the accepted cost of
        # `dir` over `git`: no network access is available to
        # flatpak-builder's sandboxed build (deps/ are git submodules,
        # which a `git` source's submodule fetch can't reach either without
        # network), so the working tree has to arrive pre-populated. See
        # build-notes.md, "Flatpak packaging", for why Flathub distribution
        # would need a different source strategy (out of scope here).
    # Our own CMakeLists.txt has no install() rules, so every app-file
    # placement below is done by hand. `ninja install` is NOT a no-op,
    # though: subprojects (zstd et al) install their headers/tools/man
    # pages into /app -- the top-level `cleanup:` list strips those from
    # the finished flatpak.
    post-install:
      # The binary is relative (post-install CWD is wherever the build
      # products are, in-source or builddir alike); the packaging files use
      # absolute in-sandbox source paths because the CWD relationship to the
      # source root is NOT stable across flatpak-builder build modes — the
      # first real build proved an in-source CWD where ../packaging didn't
      # exist. /run/build/<module-name> is deterministic for a dir source.
      - install -Dm755 KnifeEdgeRecompiled /app/bin/knife-edge-recompiled-bin
      - install -Dm755 /run/build/knife-edge-recompiled/packaging/flatpak/knife-edge-recompiled.sh
          /app/bin/knife-edge-recompiled.sh
      - install -Dm644 /run/build/knife-edge-recompiled/packaging/flatpak/io.github.haydenmc.KnifeEdgeRecompiled.desktop
          /app/share/applications/io.github.haydenmc.KnifeEdgeRecompiled.desktop
      - install -Dm644 /run/build/knife-edge-recompiled/packaging/flatpak/io.github.haydenmc.KnifeEdgeRecompiled.metainfo.xml
          /app/share/metainfo/io.github.haydenmc.KnifeEdgeRecompiled.metainfo.xml
      - install -Dm644 /run/build/knife-edge-recompiled/packaging/flatpak/io.github.haydenmc.KnifeEdgeRecompiled.svg
          /app/share/icons/hicolor/scalable/apps/io.github.haydenmc.KnifeEdgeRecompiled.svg
