# Knife Edge - Nose Gunner (USA): audio microcode (libultra `aspMain`).
#
# See analysis/docs/audio.md for the full derivation. Summary of the evidence:
#
#   * The game builds its M_AUDTASK OSTask in func_800CDD00 (boot segment,
#     0x800CDDC0..0x800CDE1C). Recovered field values:
#         t.type            = 2               (M_AUDTASK)
#         t.ucode_boot      = 0x800E51F0      (rspboot, ROM 0x23DF0)
#         t.ucode_boot_size = 0xD0
#         t.ucode           = 0x800E52C0      (ROM 0x23EC0)  <- text_offset
#         t.ucode_data      = 0x800EE460      (ROM 0x2D060)
#         t.ucode_data_size = 0x800
#     t.ucode_size is never written, so it is 0 (the struct lives in boot .bss)
#     and osSpTaskLoad substitutes SP_UCODE_SIZE.
#
#   * Disassembling ucode_boot as RSP shows the stock libultra rspboot: it DMAs
#     0xF80 bytes from t.ucode to SP_MEM_ADDR 0x1080 and then `jr` to 0x1080.
#     Hence text_address = 0x1080 (IMEM offset 0x80).
#
#   * The blob at 0x800E52C0 runs into the F3DEX2 graphics ucode text at IMEM
#     0x1EA0 (`vxor $v0,$v0,$v0` + DPC_STATUS/DPC_START/DPC_END accesses); the
#     last audio instruction is the `j 0x1118` at 0x1E94. So the audio text is
#     0x1EA0 - 0x1080 = 0xE20 bytes.
text_offset = 0x23EC0
text_size = 0xE20
text_address = 0x1080

rom_file_path = "../build/knife_edge.z64"
output_file_path = "../generated/us/rsp/aspMain.cpp"
output_function_name = "aspMain"

# The audio ABI command dispatcher at IMEM 0x1104..0x110C is
#     add $2, $zero, $1 ; lh $2, 0x10($2) ; jr $2
# i.e. an indexed load out of the 16-entry halfword jump table that lives at
# ucode_data offset 0x10 (DMEM 0x10..0x30). RSPRecomp cannot see through the
# table, so its entries are listed here. Read straight out of the ROM at
# 0x2D070 (= ucode_data + 0x10); in ABI order these are
# SPNOOP, ADPCM, CLEARBUFF, ENVMIXER, LOADBUFF, RESAMPLE, SAVEBUFF, SEGMENT,
# SETBUFF, SETVOL, DMEMMOVE, LOADADPCM, MIXER, INTERLEAVE, POLEF, SETLOOP.
extra_indirect_branch_targets = [
    0x1118, # 0x00 SPNOOP     (also the "next command" loop head)
    0x1470, # 0x01 ADPCM
    0x11DC, # 0x02 CLEARBUFF
    0x1B38, # 0x03 ENVMIXER
    0x1214, # 0x04 LOADBUFF
    0x187C, # 0x05 RESAMPLE
    0x1254, # 0x06 SAVEBUFF
    0x12D0, # 0x07 SEGMENT
    0x12EC, # 0x08 SETBUFF
    0x1328, # 0x09 SETVOL
    0x140C, # 0x0A DMEMMOVE
    0x1294, # 0x0B LOADADPCM
    0x1E24, # 0x0C MIXER
    0x138C, # 0x0D INTERLEAVE
    0x170C, # 0x0E POLEF
    0x144C, # 0x0F SETLOOP
]

# The remaining indirect jumps are ordinary linked returns that RSPRecomp finds
# on its own: `jr $ra` at 0x11A8/0x11D4 and the `addi $5, $ra, 0` / `jr $5`
# save-restore pair at 0x1150/0x117C.
unsupported_instructions = []
